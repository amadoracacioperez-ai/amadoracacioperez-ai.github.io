    travail via l'API Gmail et Claude prend les décisions. Ma boîte est passée de 16 142 fils à 27.
  es: >-
    Etiqueta cada correo según el remitente, archiva el ruido, crea filtros de Gmail y, cuando se lo
    pido, me envía un resumen de tareas pendientes ordenadas por urgencia. Python hace el trabajo
    pesado con la API de Gmail y Claude decide lo que requiere criterio. Mi bandeja pasó de 16.142
    hilos a 27.
