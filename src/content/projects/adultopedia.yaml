description:
  en: >-
    An app for young people who have just moved out: daily missions instead of endless lists, short
    guides on cooking, money and the home, and XP, levels and streaks to stay consistent. Shared flats
    split the chores between flatmates, and Google Calendar events appear next to the day's tasks. In
    Spanish, English and French.
  fr: >-
    Une app pour les jeunes qui viennent de prendre leur indépendance : des missions quotidiennes au
    lieu de listes sans fin, des guides courts sur la cuisine, l'argent et la maison, et de l'XP, des
    niveaux et des séries pour rester régulier. La colocation répartit les tâches entre colocataires et
    les événements de Google Agenda s'affichent à côté des tâches du jour. En espagnol, en anglais et
    en français.
  es: >-
    Una app para gente joven que se acaba de independizar: misiones diarias en lugar de listas
    infinitas, guías breves de cocina, finanzas y hogar, y experiencia, niveles y rachas para mantener
    la constancia. El piso compartido reparte las tareas entre convivientes y los eventos de Google
    Calendar aparecen junto a las tareas del día. En español, inglés y francés.
