    invoice fingerprints, QR codes and submissions to the tax agency's test environment.
  fr: >-
    Une application web pour gérer une petite entreprise : devis, bons de livraison, factures,
    dépenses, trésorerie, contacts et utilisateurs, avec des documents PDF. Conçue pour respecter la
    norme espagnole de facturation Veri*Factu : empreintes chaînées des factures, QR codes et envois à
    l'environnement de test de l'administration fiscale.
  es: >-
    Una app web para gestionar una pequeña empresa: presupuestos, albaranes, facturas, gastos, caja,
    terceros y usuarios, con documentos en PDF. Preparada para cumplir Veri*Factu: huella encadenada
    de las facturas, códigos QR y envíos al entorno de pruebas de la AEAT.
stack: [Next.js, TypeScript, Prisma, PostgreSQL, React PDF, Docker]
